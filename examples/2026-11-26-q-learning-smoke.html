<!doctype html>
<html lang="zh-CN" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>Q-learning 的一次真实更新</title>
  <style>:root {
  --bg: #fbfbf8;
  --bg-elev: #ffffff;
  --panel: #ffffff;
  --panel-soft: #f5f5f0;
  --text: #1f2328;
  --text-soft: #46505a;
  --muted: #6b7280;
  --border: #e3e3dc;
  --border-strong: #c9c9c0;
  --accent: #0f766e;
  --accent-soft: #e6f4f1;
  --code-bg: #f2f3ee;
  --success: #15803d;
  --success-soft: #e9f7ee;
  --danger: #b91c1c;
  --danger-soft: #fdecec;
  --warning: #b45309;
  --warning-soft: #fdf3e3;
  --info: #1d4ed8;
  --info-soft: #e8efff;
  --purple: #6d28d9;
  --purple-soft: #f1eaff;
  --tok-key: #9f1239;
  --tok-str: #166534;
  --tok-num: #1d4ed8;
  --tok-com: #6b7280;
  --shadow: 0 1px 2px rgba(0, 0, 0, .04), 0 12px 32px rgba(0, 0, 0, .05);
  --radius: 10px;
  --topbar: 56px;
  --sidebar: 292px;
  --content: 860px;
  --font-sans: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
  --font-serif: "Iowan Old Style", "Palatino Linotype", Georgia, "Songti SC", serif;
  --font-mono: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace;
}

html[data-theme="dark"] {
  --bg: #0f1214;
  --bg-elev: #151a1d;
  --panel: #161b1f;
  --panel-soft: #1b2126;
  --text: #e6e8ea;
  --text-soft: #b8c0c7;
  --muted: #8b969f;
  --border: #2a3137;
  --border-strong: #3b444c;
  --accent: #5eead4;
  --accent-soft: #12332f;
  --code-bg: #101518;
  --success: #4ade80;
  --success-soft: #11291a;
  --danger: #f87171;
  --danger-soft: #321417;
  --warning: #fbbf24;
  --warning-soft: #33240b;
  --info: #93c5fd;
  --info-soft: #12213a;
  --purple: #c4b5fd;
  --purple-soft: #241b3a;
  --tok-key: #fda4af;
  --tok-str: #86efac;
  --tok-num: #93c5fd;
  --tok-com: #8b969f;
  --shadow: 0 1px 2px rgba(0, 0, 0, .3), 0 16px 40px rgba(0, 0, 0, .35);
}

* { box-sizing: border-box; }

html {
  scroll-behavior: smooth;
  scroll-padding-top: calc(var(--topbar) + 14px);
}

body {
  margin: 0;
  background: var(--bg);
  color: var(--text);
  font-family: var(--font-sans);
  font-size: 16px;
  line-height: 1.7;
  -webkit-font-smoothing: antialiased;
}

body.locked { overflow: hidden; }

a { color: var(--accent); text-decoration: none; }
a:hover { text-decoration: underline; }

button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; }

[hidden] { display: none !important; }

:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

::selection { background: var(--accent-soft); color: var(--text); }

.visually-hidden {
  position: absolute;
  width: 1px;
  height: 1px;
  padding: 0;
  margin: -1px;
  overflow: hidden;
  clip: rect(0, 0, 0, 0);
  white-space: nowrap;
  border: 0;
}

.skip-link {
  position: absolute;
  left: -9999px;
  top: 8px;
  z-index: 300;
  padding: 8px 12px;
  background: var(--bg-elev);
  border: 1px solid var(--border);
  border-radius: 8px;
}
.skip-link:focus { left: 8px; }

/* 顶栏 */
.topbar {
  position: fixed;
  inset: 0 0 auto 0;
  height: var(--topbar);
  z-index: 50;
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 0 18px;
  background: var(--bg-elev);
  background: color-mix(in srgb, var(--bg-elev) 92%, transparent);
  border-bottom: 1px solid var(--border);
  backdrop-filter: blur(10px);
}

.topbar-title {
  flex: 1;
  min-width: 0;
  display: flex;
  align-items: baseline;
  gap: 10px;
}

.brand {
  font-size: 12px;
  font-weight: 800;
  letter-spacing: .12em;
  text-transform: uppercase;
  color: var(--accent);
  white-space: nowrap;
}

.topic-title {
  font-size: 13.5px;
  font-weight: 650;
  color: var(--text-soft);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.chapter-indicator {
  font-size: 12px;
  color: var(--muted);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.topbar-actions { display: flex; gap: 6px; }

.icon-btn {
  width: 34px;
  height: 34px;
  display: grid;
  place-items: center;
  border: 1px solid var(--border);
  border-radius: 8px;
  background: var(--bg-elev);
  color: var(--text-soft);
  font-size: 16px;
  line-height: 1;
  flex: none;
}
.icon-btn:hover { background: var(--panel-soft); color: var(--text); }

.nav-toggle { display: none; }

.progress {
  position: absolute;
  left: 0;
  right: 0;
  bottom: -1px;
  height: 2px;
  background: transparent;
}
.progress-bar {
  height: 100%;
  width: 0;
  background: var(--accent);
  transition: width .12s linear;
}

/* 布局 */
.layout {
  display: flex;
  min-height: 100vh;
  padding-top: var(--topbar);
}

.sidebar {
  position: fixed;
  top: var(--topbar);
  bottom: 0;
  left: 0;
  width: var(--sidebar);
  z-index: 40;
  display: flex;
  flex-direction: column;
  background: var(--bg-elev);
  border-right: 1px solid var(--border);
}

.sidebar-head { padding: 18px 16px 10px; }

.sidebar-kicker {
  font-size: 11px;
  font-weight: 700;
  letter-spacing: .12em;
  text-transform: uppercase;
  color: var(--muted);
}

.search-wrap { display: block; margin-top: 10px; }

.tree-search {
  width: 100%;
  padding: 8px 10px;
  border: 1px solid var(--border);
  border-radius: 8px;
  background: var(--bg);
  color: var(--text);
  font: inherit;
  font-size: 13px;
  outline: none;
}
.tree-search:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }

.tree {
  flex: 1;
  overflow: auto;
  padding: 4px 8px 20px;
  overscroll-behavior: contain;
}

.tree ul { list-style: none; margin: 0; padding: 0; }
.tree-children {
  margin-left: 9px;
  padding-left: 2px;
  border-left: 1px solid var(--border);
}

.tree-row {
  display: flex;
  align-items: center;
  gap: 6px;
  padding: 5px 8px;
  border-radius: 7px;
  color: var(--text-soft);
  font-size: 13.5px;
  line-height: 1.35;
  cursor: pointer;
}
.tree-row:hover { background: var(--panel-soft); }
.tree-row.active {
  background: var(--accent-soft);
  color: var(--accent);
  font-weight: 650;
}
.tree-row.match .tree-title { background: var(--warning-soft); border-radius: 3px; }

.tree-title {
  flex: 1;
  min-width: 0;
  display: -webkit-box;
  -webkit-line-clamp: 2;
  -webkit-box-orient: vertical;
  overflow: hidden;
  overflow-wrap: anywhere;
}

.tree-toggle {
  width: 18px;
  height: 18px;
  flex: none;
  display: grid;
  place-items: center;
  border-radius: 4px;
  color: var(--muted);
  font-size: 10px;
  transition: transform .15s ease;
}
.tree-toggle.open { transform: rotate(90deg); }
.tree-toggle:hover { background: var(--border); color: var(--text); }
.tree-spacer { width: 18px; flex: none; }

.tree-badge {
  width: 19px;
  height: 19px;
  flex: none;
  display: grid;
  place-items: center;
  border: 1px solid var(--border);
  border-radius: 5px;
  background: var(--panel-soft);
  color: var(--muted);
  font-size: 9.5px;
  font-weight: 800;
}

.type-topic .tree-badge { color: var(--accent); border-color: var(--accent); }
.type-concept .tree-badge { color: var(--info); background: var(--info-soft); }
.type-algorithm .tree-badge { color: var(--warning); background: var(--warning-soft); }
.type-module .tree-badge,
.type-component .tree-badge { color: var(--purple); background: var(--purple-soft); }
.type-process .tree-badge { color: var(--success); background: var(--success-soft); }

.sidebar-foot {
  padding: 12px 16px;
  border-top: 1px solid var(--border);
  color: var(--muted);
  font-size: 11.5px;
  line-height: 1.5;
}

.sidebar-backdrop {
  position: fixed;
  inset: var(--topbar) 0 0 0;
  z-index: 35;
  background: rgba(0, 0, 0, .35);
}

/* 正文 */
.main {
  flex: 1;
  min-width: 0;
  margin-left: var(--sidebar);
  padding: 0 32px 80px;
}

.hero {
  max-width: var(--content);
  margin: 0 auto;
  padding: 54px 0 28px;
  border-bottom: 1px solid var(--border);
}

.eyebrow {
  margin: 0 0 10px;
  color: var(--accent);
  font-size: 12px;
  font-weight: 700;
  letter-spacing: .14em;
  text-transform: uppercase;
}

.hero h1 {
  margin: 0 0 14px;
  font-size: clamp(30px, 4vw, 46px);
  line-height: 1.14;
  letter-spacing: -.02em;
  font-weight: 750;
}

.lede {
  max-width: 70ch;
  margin: 0;
  color: var(--text-soft);
  font-size: 18px;
  line-height: 1.65;
}

.hero-meta {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  margin-top: 22px;
}

.meta-chip {
  padding: 4px 10px;
  border: 1px solid var(--border);
  border-radius: 999px;
  background: var(--bg-elev);
  color: var(--muted);
  font-size: 12px;
}

.chapter {
  max-width: var(--content);
  margin: 0 auto;
  padding: 48px 0 10px;
  border-bottom: 1px solid var(--border);
  scroll-margin-top: calc(var(--topbar) + 14px);
}
.chapter:last-of-type { border-bottom: 0; }

.chapter-head { margin-bottom: 14px; }

.chapter-kicker {
  margin-bottom: 6px;
  color: var(--muted);
  font-size: 12px;
  font-weight: 700;
  letter-spacing: .12em;
  text-transform: uppercase;
}

.chapter h2 {
  margin: 0 0 10px;
  font-size: clamp(24px, 3vw, 32px);
  line-height: 1.25;
  letter-spacing: -.01em;
}

.chapter-summary {
  max-width: 70ch;
  margin: 0 0 22px;
  color: var(--text-soft);
  font-size: 16px;
}

.chapter p,
.chapter li { font-size: 16.5px; line-height: 1.78; }

.chapter h3 { margin: 34px 0 10px; font-size: 20px; line-height: 1.35; }
.chapter h4 { margin: 24px 0 8px; font-size: 17px; }

.chapter ul,
.chapter ol { margin: 12px 0; padding-left: 1.4em; }
.chapter li { margin: 4px 0; }

.chapter blockquote {
  margin: 20px 0;
  padding: 12px 18px;
  border-left: 3px solid var(--accent);
  border-radius: 0 8px 8px 0;
  background: var(--panel-soft);
  color: var(--text-soft);
}

.chapter code,
.detail-body code {
  padding: 2px 5px;
  border: 1px solid var(--border);
  border-radius: 4px;
  background: var(--code-bg);
  font-family: var(--font-mono);
  font-size: .9em;
}

.chapter pre,
.detail-body pre {
  position: relative;
  margin: 18px 0;
  padding: 16px;
  overflow: auto;
  border: 1px solid var(--border);
  border-radius: 10px;
  background: var(--code-bg);
  line-height: 1.55;
}

.chapter pre code,
.detail-body pre code {
  padding: 0;
  border: 0;
  background: none;
  font-size: 13.5px;
  white-space: pre;
}

.copy-btn {
  position: absolute;
  top: 8px;
  right: 8px;
  padding: 3px 8px;
  border: 1px solid var(--border);
  border-radius: 6px;
  background: var(--bg-elev);
  color: var(--muted);
  font-size: 11px;
  opacity: 0;
  transition: opacity .15s ease;
}
pre:hover .copy-btn,
.copy-btn:focus { opacity: 1; }

.table-wrap {
  margin: 18px 0;
  overflow-x: auto;
  border: 1px solid var(--border);
  border-radius: 10px;
}

.table-wrap table {
  width: 100%;
  min-width: 520px;
  border-collapse: collapse;
  font-size: 14.5px;
}

.table-wrap th,
.table-wrap td {
  padding: 9px 12px;
  border-bottom: 1px solid var(--border);
  text-align: left;
  vertical-align: top;
}

.table-wrap th {
  background: var(--panel-soft);
  color: var(--text);
  font-weight: 650;
  font-size: 13px;
}

.table-wrap tr:last-child td { border-bottom: 0; }

.source-ref {
  font-size: 11px;
  vertical-align: super;
  line-height: 0;
  margin-left: 1px;
}

.source-chip {
  display: inline-flex;
  align-items: center;
  padding: 1px 7px;
  border: 1px solid var(--border);
  border-radius: 999px;
  background: var(--panel-soft);
  color: var(--muted);
  font-size: 11px;
  line-height: 1.6;
}
.source-chip:hover { color: var(--accent); border-color: var(--accent); text-decoration: none; }

.chip-row { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 6px; }

.chapter-sources {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 6px;
  margin-top: 22px;
  padding-top: 12px;
  border-top: 1px dashed var(--border);
  color: var(--muted);
  font-size: 12.5px;
}
.chapter-sources .label { margin-right: 2px; color: var(--text-soft); font-weight: 650; }

.concept-link,
.detail-link {
  display: inline;
  padding: 0;
  border: 0;
  background: none;
  color: var(--accent);
  font: inherit;
  text-decoration: underline;
  text-decoration-style: dotted;
  text-underline-offset: 3px;
  cursor: pointer;
}
.concept-link:hover,
.detail-link:hover { text-decoration-style: solid; }

.callout {
  margin: 18px 0;
  padding: 14px 16px;
  border: 1px solid var(--border);
  border-radius: 10px;
  background: var(--panel-soft);
}

/* 场景 */
.scene {
  margin: 28px 0;
  overflow: hidden;
  border: 1px solid var(--border);
  border-radius: 12px;
  background: var(--bg-elev);
}

.scene-head {
  padding: 16px 18px 12px;
  border-bottom: 1px solid var(--border);
}

.scene-kicker {
  margin-bottom: 4px;
  color: var(--muted);
  font-size: 10.5px;
  font-weight: 700;
  letter-spacing: .12em;
  text-transform: uppercase;
}

.scene h3 { margin: 0 0 4px; font-size: 17px; line-height: 1.35; }

.scene-desc { margin: 0; color: var(--muted); font-size: 13.5px; line-height: 1.6; }

.scene-body { padding: 18px; }

.scene-sources {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
  padding: 0 18px 14px;
  color: var(--muted);
  font-size: 11.5px;
}

.scene-empty {
  padding: 14px;
  border: 1px dashed var(--border);
  border-radius: 8px;
  color: var(--muted);
  font-size: 13px;
}

/* 时间线 */
.timeline {
  position: relative;
  margin: 0;
  padding: 0 0 0 22px;
  list-style: none;
}
.timeline::before {
  content: "";
  position: absolute;
  left: 6px;
  top: 6px;
  bottom: 6px;
  width: 2px;
  background: var(--border);
}
.timeline li { position: relative; padding: 0 0 20px 8px; }
.timeline li:last-child { padding-bottom: 0; }
.timeline li::before {
  content: "";
  position: absolute;
  left: -20px;
  top: 5px;
  width: 10px;
  height: 10px;
  border: 2px solid var(--accent);
  border-radius: 50%;
  background: var(--bg-elev);
}
.timeline-date { color: var(--accent); font-size: 12px; font-weight: 750; letter-spacing: .04em; }
.timeline-title { margin: 2px 0; font-weight: 650; }
.timeline-text { margin: 0; color: var(--text-soft); font-size: 14px; line-height: 1.65; }
.timeline li.active .timeline-title { color: var(--accent); }
.timeline li.active::before { background: var(--accent); box-shadow: 0 0 0 4px var(--accent-soft); }

/* 图 */
.graph-wrap { overflow-x: auto; }

.scene-graph { display: block; width: 100%; height: auto; }

.scene-graph .node { cursor: pointer; }
.scene-graph .node rect {
  fill: var(--panel);
  stroke: var(--border-strong);
  stroke-width: 1.2;
  rx: 8;
}
.scene-graph .node:hover rect { stroke: var(--accent); }
.scene-graph .node.active rect { fill: var(--accent-soft); stroke: var(--accent); stroke-width: 2.2; }
.scene-graph .node text {
  fill: var(--text);
  font-family: var(--font-sans);
  font-size: 12.5px;
  font-weight: 650;
  text-anchor: middle;
  dominant-baseline: middle;
  pointer-events: none;
}
.scene-graph .node[data-group="external"] rect { fill: var(--panel-soft); }
.scene-graph .node[data-group="model"] rect { fill: var(--info-soft); }
.scene-graph .node[data-group="data"] rect { fill: var(--warning-soft); }

.scene-graph .edge line { stroke: var(--border-strong); stroke-width: 1.4; }
.scene-graph .edge.dashed line { stroke-dasharray: 5 4; }
.scene-graph .edge.active line { stroke: var(--accent); stroke-width: 2.2; }
.scene-graph .edge text {
  fill: var(--muted);
  font-family: var(--font-sans);
  font-size: 10.5px;
  text-anchor: middle;
  paint-order: stroke;
  stroke: var(--bg-elev);
  stroke-width: 4px;
  stroke-linejoin: round;
}
.scene-graph .edge.active text { fill: var(--accent); font-weight: 700; }
.scene-graph .arrow { fill: var(--border-strong); }
.scene-graph .edge.active .arrow { fill: var(--accent); }

.scene-detail {
  margin-top: 12px;
  padding: 12px 14px;
  border: 1px solid var(--border);
  border-radius: 8px;
  background: var(--panel-soft);
  color: var(--text-soft);
  font-size: 14px;
  line-height: 1.65;
}
.scene-detail strong { color: var(--text); }

/* 时序图 */
.sequence-wrap { overflow-x: auto; }
.sequence-svg { display: block; width: 100%; height: auto; }
.sequence-actor rect { fill: var(--panel-soft); stroke: var(--border-strong); rx: 7; }
.sequence-actor text { fill: var(--text); font-family: var(--font-sans); font-size: 12px; font-weight: 650; text-anchor: middle; dominant-baseline: middle; }
.sequence-lifeline { stroke: var(--border); stroke-width: 1.2; stroke-dasharray: 4 5; }
.sequence-message line,
.sequence-message path { stroke: var(--border-strong); stroke-width: 1.4; }
.sequence-message.active line,
.sequence-message.active path { stroke: var(--accent); stroke-width: 2.2; }
.sequence-message.dim { opacity: .28; }
.sequence-message text { fill: var(--muted); font-family: var(--font-sans); font-size: 11px; text-anchor: middle; paint-order: stroke; stroke: var(--bg-elev); stroke-width: 4px; }
.sequence-message.active text { fill: var(--accent); font-weight: 700; }
.sequence-message .arrow { fill: var(--border-strong); }
.sequence-message.active .arrow { fill: var(--accent); }

/* 步骤控制 */
.stepper {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 8px;
  margin-top: 14px;
  padding-top: 12px;
  border-top: 1px solid var(--border);
}
.stepper button {
  padding: 5px 10px;
  border: 1px solid var(--border);
  border-radius: 6px;
  background: var(--panel);
  color: var(--text-soft);
  font-size: 12px;
}
.stepper button:hover { border-color: var(--accent); color: var(--accent); }
.stepper button:disabled { opacity: .4; cursor: not-allowed; }
.stepper button.primary { border-color: var(--accent); color: var(--accent); background: var(--accent-soft); }
.step-label { margin-left: auto; color: var(--muted); font-size: 12px; font-variant-numeric: tabular-nums; }

/* 流程图 */
.process-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
  gap: 10px;
}
.process-step {
  width: 100%;
  padding: 10px 12px;
  border: 1px solid var(--border);
  border-radius: 9px;
  background: var(--panel);
  color: inherit;
  font: inherit;
  text-align: left;
  cursor: pointer;
}
.process-step:hover { border-color: var(--accent); }
.process-step.active { border-color: var(--accent); background: var(--accent-soft); box-shadow: inset 0 0 0 1px var(--accent); }
.process-step .num { color: var(--muted); font-size: 10px; font-weight: 750; letter-spacing: .08em; }
.process-step .t { font-size: 13.5px; font-weight: 650; line-height: 1.4; }

.step-detail {
  margin-top: 12px;
  padding: 12px 14px;
  border: 1px solid var(--border);
  border-radius: 8px;
  background: var(--panel-soft);
  color: var(--text-soft);
  font-size: 14px;
  line-height: 1.65;
}
.step-detail strong { color: var(--text); }

.state-table { width: 100%; margin-top: 8px; border-collapse: collapse; font-size: 12.5px; }
.state-table th,
.state-table td { padding: 4px 8px; border-bottom: 1px solid var(--border); text-align: left; }

/* 对比 */
.comparison-table { min-width: 640px; }
.comparison-table th:first-child,

.algo-table-wrap {

  z-index: 1;
  background: var(--panel-soft);
  color: var(--text);
  font-size: 12.5px;
  font-weight: 650;
}
.algo-table tr.active td { background: var(--accent-soft); }
.algo-table tr:last-child td { border-bottom: 0; }

/* 数据结构 */
.ds-grid { display: flex; flex-wrap: wrap; gap: 8px; }
.ds-cell {
  min-width: 64px;
  padding: 8px 10px;
  border: 1px solid var(--border);

  background: var(--panel);

}
.ds-cell.active { border-color: var(--accent); background: var(--accent-soft); }

.concept-groups {

}
.concept-group { padding: 12px; border: 1px solid var(--border); border-radius: 9px; }
.concept-group h4 {
  margin: 0 0 8px;
  color: var(--muted);
  font-size: 11px;
  font-weight: 700;
  letter-spacing: .08em;
  text-transform: uppercase;
}
.concept-chips { display: flex; flex-wrap: wrap; gap: 6px; }
.concept-chip {
  padding: 3px 9px;
  border: 1px solid var(--border);
  border-radius: 999px;
  background: var(--panel-soft);
  color: var(--text-soft);
  font: inherit;
  font-size: 12.5px;
  cursor: pointer;
}
.concept-chip:hover { border-color: var(--accent); color: var(--accent); }

.relation-list {

  flex-direction: column;
  gap: 6px;
  margin: 14px 0 0;
  padding: 0;
  list-style: none;
  color: var(--text-soft);
  font-size: 13px;
}
.relation-list .arrow { margin: 0 6px; color: var(--muted); }

  gap: 12px;
}
.future-card { padding: 14px; border: 1px solid var(--border); border-radius: 10px; background: var(--panel); }

  font-weight: 700;

.future-evidence {

  line-height: 1.55;

.future-legend { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 12px; }

/* 测验 */

  color: var(--text-soft);

.quiz-option:hover:not(:disabled) { border-color: var(--accent); }
.quiz-option .key { flex: none; color: var(--muted); font-weight: 750; }

折扣后的未来价值”，这让\u003cbutton class=\"concept-link\" data-concept=\"bellman\">贝尔曼方程\u003c/button>成为几乎所有值函数方法的起点。\u003c/p>\u003cdiv data-scene=\"scene-history\">\u003c/div>\u003cblockquote>关键不是记住公式，而是理解每一步为什么需要下一个状态的价值。\u003c/blockquote>\u003cp>来源：\u003ca href=\"#src-sutton2018\" class=\"source-ref\">[1]\u003c/a>\u003c/p>","sceneIds":["scene-history"],"sourceIds":["sutton2018"]},{"id":"mechanics","title":"机制：一次 Q 值更新","summary":"本章回答：一条经验如何改变 Q 表中的一个数。","order":2,"content":"\u003cp>Q-learning 用一张表记录“在状态 s 做动作 a 有多好”。一次更新只需要当前 Q、即时奖励、下一状态的最大 Q 和学习率。\u003c/p>\u003cdiv data-scene=\"scene-q-update\">\u003c/div>\u003cp>把一次交互按时间展开，就是智能体与环境之间不断往返的消息。\u003c/p>\u003cdiv data-scene=\"scene-loop\">\u003c/div>\u003cpre>\u003ccode data-lang=\"python\">q[s, a] = q[s, a] + alpha * (r + gamma * max(q[s2].values()) - q[s, a])\u003c/code>\u003c/pre>\u003cp>算法细节见 \u003cbutton class=\"concept-link\" data-algorithm=\"q-update\">Q-learning 更新\u003c/button>。\u003c/p>","sceneIds":["scene-q-update","scene-loop"],"sourceIds":["watkins1992","sutton2018"]},{"id":"system","title":"系统：从 Q 表到 DQN","summary":"本章回答：状态空间变大后，Q 表如何变成神经网络。","order":3,"content":"\u003cp>当状态空间变大，Q 表会被神经网络替代。下面的架构图展示 DQN 的训练闭环。\u003c/p>\u003cdiv data-scene=\"scene-dqn\">\u003c/div>\u003cdiv data-scene=\"scene-train\">\u003c/div>\u003cdiv data-scene=\"scene-compare\">\u003c/div>\u003cdiv data-scene=\"scene-buffer\">\u003c/div>\u003cdiv data-scene=\"scene-concepts\">\u003c/div>\u003cdiv data-scene=\"scene-future\">\u003c/div>\u003cp>模块细节见 \u003cbutton class=\"concept-link\" data-module=\"dqn-agent\">DQN Agent\u003c/button>，缓冲区见 \u003cbutton class=\"concept-link\" data-concept=\"replay-buffer\">回放缓冲区\u003c/button>。\u003c/p>","sceneIds":["scene-dqn","scene-train","scene-compare","scene-buffer","scene-concepts","scene-future"],"sourceIds":["mnih2015","schulman2017"]}],"concepts":[{"id":"mdp","name":"马尔可夫决策过程","definition":"用状态、动作、转移、奖励和折扣描述序贯决策的形式化框架。","explanation":"它假设下一步只依赖当前状态，而不是全部历史；这让问题可以用递推的方式求解。","principles":["状态必须包含做决策所需的信息","奖励是即时反馈，回报是折扣累加","策略决定在每个状态选择什么动作"],"examples":["网格世界中的位置是状态，上下左右是动作","机器人关节角度是状态，电机指令是动作"],"relatedConceptIds":["bellman"],"sourceIds":["sutton2018"]},{"id":"bellman","name":"贝尔曼方程","definition":"把价值函数写成“即时奖励 + 折扣后的下一状态价值”的递推关系。","explanation":"它把长期问题拆成一步问题：只要知道下一状态的价值，就能修正当前状态的价值。","principles":["价值 = 即时奖励 + 折扣 × 未来价值","最优价值满足贝尔曼最优方程","递推让动态规划成为可能"],"examples":["Q-learning 的目标 r + γ·max Q(s′,a′)","策略评估中的迭代更新"],"relatedConceptIds":["mdp","q-learning"],"sourceIds":["sutton2018"]},{"id":"q-learning","name":"Q-learning","definition":"一种无需环境模型的时序差分控制方法，直接学习状态-动作价值 Q(s,a)。","explanation":"它用实际观察到的奖励和下一状态的最大 Q 值构造目标，再用学习率把当前 Q 拉向目标。","principles":["离策略更新：行为策略和目标策略可以不同","自举：用估计值更新估计值","探索与利用需要平衡"],"examples":["表格型 Q-learning 更新 Q 表","DQN 用神经网络近似 Q(s,a)"],"relatedConceptIds":["bellman","exploration"],"sourceIds":["watkins1992","sutton2018"]},{"id":"replay-buffer","name":"回放缓冲区","definition":"保存历史转移 (s, a, r, s′)，训练时从中采样 mini-batch 的数据结构。","explanation":"它打破连续样本之间的相关性，并让一条经验可以被多次使用，从而提高样本效率。","principles":["先进先出或按优先级采样","容量有限，旧数据会被覆盖","采样批次需要随机化"],"examples":["DQN 使用均匀采样的回放缓冲区","优先经验回放按 TD 误差采样"],"relatedConceptIds":["q-learning"],"sourceIds":["mnih2015"]},{"id":"exploration","name":"探索","definition":"在不确定环境中尝试新动作，以发现可能更好的策略。","explanation":"如果只选当前估计最好的动作，智能体可能永远错过更优解；探索让估计有机会被修正。","principles":["ε-greedy 以概率 ε 随机探索","探索率通常随训练衰减","探索不足会导致局部最优"],"examples":["ε 从 1.0 衰减到 0.1","汤普森采样用于多臂老虎机"],"relatedConceptIds":["q-learning"],"sourceIds":["sutton2018"]}],"algorithms":[{"id":"q-update","name":"Q-learning 更新","problem":"在不知道环境转移概率的情况下，估计每个状态-动作对的长期价值。","background":"时序差分学习把蒙特卡洛的采样和动态规划的自举结合起来，Q-learning 是其中最具代表性的离策略控制方法。","principle":"用 r + γ·max Q(s′,a′) 作为目标，把当前 Q(s,a) 向目标移动 α 步。","prerequisites":["mdp","bellman"],"formulas":["\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\">\u003cmi>Q\u003c/mi>\u003cmo>(\u003c/mo>\u003cmi>s\u003c/mi>\u003cmo>,\u003c/mo>\u003cmi>a\u003c/mi>\u003cmo>)\u003c/mo>\u003cmo>←\u003c/mo>\u003cmi>Q\u003c/mi>\u003cmo>(\u003c/mo>\u003cmi>s\u003c/mi>\u003cmo>,\u003c/mo>\u003cmi>a\u003c/mi>\u003cmo>)\u003c/mo>\u003cmo>+\u003c/mo>\u003cmi>α\u003c/mi>\u003cmo>[\u003c/mo>\u003cmi>r\u003c/mi>\u003cmo>+\u003c/mo>\u003cmi>γ\u003c/mi>\u003cmunder>\u003cmo>max\u003c/mo>\u003cmi>a′\u003c/mi>\u003c/munder>\u003cmi>Q\u003c/mi>\u003cmo>(\u003c/mo>\u003cmi>s′\u003c/mi>\u003cmo>,\u003c/mo>\u003cmi>a′\u003c/mi>\u003cmo>)\u003c/mo>\u003cmo>−\u003c/mo>\u003cmi>Q\u003c/mi>\u003cmo>(\u003c/mo>\u003cmi>s\u003c/mi>\u003cmo>,\u003c/mo>\u003cmi>a\u003c/mi>\u003cmo>)\u003c/mo>\u003cmo>]\u003c/mo>\u003c/math>"],"pseudocode":"for each transition (s, a, r, s2):\n    target = r + gamma * max(Q[s2])\n    Q[s, a] += alpha * (target - Q[s, a])","steps":[{"title":"观察转移","text":"从环境中得到当前状态、动作、奖励和下一状态。"},{"title":"计算目标","text":"用下一状态的最大 Q 值构造 TD 目标。"},{"title":"更新当前值","text":"按学习率把当前 Q 拉向目标。"}],"complexity":{"time":"O(|A|) 每次更新","space":"O(|S|·|A|)"},"advantages":["不需要环境模型","实现简单，适合教学和基线","可以离策略学习"],"limitations":["表格方法难以扩展到高维状态","对学习率和探索敏感","最大化偏差可能高估 Q 值"],"applications":["网格世界","推荐系统冷启动","作为 DQN 的理论基础"],"relatedAlgorithmIds":[],"sourceIds":["watkins1992","sutton2018"]}],"modules":[{"id":"dqn-agent","name":"DQN Agent","responsibility":"用神经网络近似 Q(s,a)，并通过回放缓冲区和目标网络稳定训练。","inputs":["当前状态 s","动作空间大小"],"outputs":["每个动作的 Q 值","选中的动作 a"],"components":["Q 网络","目标网络","回放缓冲区","ε-greedy 策略"],"dependencies":["深度学习框架","环境接口"],"executionFlow":["接收状态并选择动作","把转移写入回放缓冲区","采样 mini-batch","计算 TD 目标并更新 Q 网络","定期同步目标网络"],"implementation":"q_values = online_net(state)\naction = epsilon_greedy(q_values)\nnext_q = target_net(next_state).max(dim=1).values\ntarget = reward + gamma * next_q * (1 - done)\nloss = mse(online_net(state)[action], target)","sourceIds":["mnih2015"]}],"scenes":[{"id":"scene-history","type":"timeline","title":"从动态规划到 DQN","description":"三个关键节点，展示值函数方法如何一步步走向深度强化学习。","data":{"events":[{"date":"1957","title":"动态规划","text":"Bellman 把序贯决策写成递推式。","sourceIds":["sutton2018"]},{"date":"1989","title":"Q-learning","text":"Watkins 提出无需环境模型的离策略控制方法。","sourceIds":["watkins1992"]},{"date":"2015","title":"DQN","text":"DeepMind 用深度网络和回放缓冲区玩 Atari。","sourceIds":["mnih2015"]}]},"sourceIds":["sutton2018"]},{"id":"scene-dqn","type":"architecture","title":"DQN 的训练闭环","description":"数据如何从环境流到网络更新。","data":{"width":760,"height":300,"nodes":[{"id":"env","label":"Environment","x":30,"y":40,"w":160,"h":56,"group":"external","detail":"执行动作，返回奖励 r 和下一状态 s′。","sourceIds":["mnih2015"]},{"id":"buffer","label":"Replay Buffer","x":290,"y":40,"w":160,"h":56,"group":"data","detail":"保存历史转移，均匀采样 mini-batch。"},{"id":"qnet","label":"Q Network","x":550,"y":40,"w":160,"h":56,"group":"model","detail":"输入状态，输出每个动作的 Q 值。"},{"id":"target","label":"Target Net","x":550,"y":180,"w":160,"h":56,"group":"model","detail":"定期从 Q 网络同步，提供稳定的 TD 目标。"}],"edges":[{"from":"env","to":"buffer","label":"transition"},{"from":"buffer","to":"qnet","label":"batch"},{"from":"qnet","to":"target","label":"同步"},{"from":"target","to":"qnet","label":"TD 目标","dashed":true}]},"sourceIds":["mnih2015"]},{"id":"scene-loop","type":"sequence","title":"Agent 与 Environment 的一步交互","description":"动作、奖励和下一状态如何流动。","data":{"actors":["Agent","Environment"],"messages":[{"from":"Agent","to":"Environment","label":"action a_t","note":"策略网络根据 s_t 选择动作。","sourceIds":["sutton2018"]},{"from":"Environment","to":"Agent","label":"r_t, s_{t+1}","note":"环境执行动作并返回反馈。"},{"from":"Agent","to":"Agent","label":"计算 TD 目标","note":"用奖励和下一状态的最大 Q 值构造目标。"}]},"sourceIds":["sutton2018"]},{"id":"scene-train","type":"process","title":"一次 DQN 更新","description":"从采样到参数更新的三个步骤。","data":{"steps":[{"title":"采样","text":"从回放缓冲区取一批 transition。","state":{"batch_size":"32","policy":"ε-greedy"},"sourceIds":["mnih2015"]},{"title":"计算目标","text":"用目标网络计算 r + γ·max Q(s′,a′)。","state":{"gamma":"0.99","target_update":"每 1000 步"}},{"title":"更新网络","text":"对当前 Q 与目标 Q 的均方误差求导并更新。","state":{"loss":"MSE","optimizer":"Adam"}}]},"sourceIds":["mnih2015"]},{"id":"scene-compare","type":"comparison","title":"Q-learning 与 PPO 的取舍","desc function $(sel, root = document) { return root.querySelector(sel); }
function $$(sel, root = document) { return Array.from(root.querySelectorAll(sel)); }

function el(tag, className, html) {
  const node = document.createElement(tag);
  if (className) node.className = className;
  if (html != null) node.innerHTML = html;
  return node;
}

function svgEl(tag, attrs = {}) {
  const node = document.createElementNS('http://www.w3.org/2000/svg', tag);
  Object.entries(attrs).forEach(([k, v]) => {
    if (v != null) node.setAttribute(k, v);
  });
  return node;
}

function esc(value) {
  return String(value == null ? '' : value)
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;')
    .replace(/'/g, '&#39;');
}

function raw(value) { return value == null ? '' : String(value); }

function byId(list) {
  const map = new Map();
  (list || []).forEach(item => { if (item && item.id) map.set(item.id, item); });
  return map;
}

function typeLabel(type) { return TYPE_LABELS[type] || type; }
function badgeFor(type) { return TYPE_BADGES[type] || '·'; }

function sourceTitle(id) {
  const source = IS.maps.sources && IS.maps.sources.get(id);
  return source ? source.title : id;
}

function sourceChips(ids) {
  const list = (ids || []).filter(Boolean);
  if (!list.length) return '';
  return list.map(id => {
    const title = sourceTitle(id);
    const short = title.length > 30 ? title.slice(0, 30) + '…' : title;
    return `<a class="source-chip" href="#src-${esc(id)}" title="${esc(title)}">${esc(short)}</a>`;
  }).join('');
}

function refButton(id, label) {
  const text = label || (IS.maps.concepts.get(id) || IS.maps.algorithms.get(id) ||
    IS.maps.modules.get(id) || IS.maps.chapters.get(id) || {}).name || id;
  if (IS.maps.concepts.has(id)) return `<button class="concept-link" data-concept="${esc(id)}">${esc(text)}</button>`;
  if (IS.maps.algorithms.has(id)) return `<button class="concept-link" data-algorithm="${esc(id)}">${esc(text)}</button>`;
  if (IS.maps.modules.has(id)) return `<button class="concept-link" data-module="${esc(id)}">${esc(text)}</button>`;
  const chapter = IS.maps.chapters.get(id);
  if (chapter) return `<a href="#ch-${esc(id)}">${esc(text)}</a>`;
  if (id === 'quiz') return '<a href="#quiz">测验</a>';
  if (id === 'sources') return '<a href="#sources">参考</a>';
  return `<span>${esc(text)}</span>`;
}

function chapterLabel(id) {
  if (id === 'quiz') return '测验';
  if (id === 'sources') return '参考';
  const chapter = IS.maps.chapters.get(id);
  return chapter ? chapter.title : id;
}

function xrefLabel(type) { return XREF_LABELS[type] || type; }
function sourceTypeLabel(type) { return SOURCE_TYPE_LABELS[type] || type || '来源'; }

function toast(message) {
  const node = $('#toast');
  if (!node) return;
  node.textContent = message;
  node.hidden = false;
  clearTimeout(toast.timer);
  toast.timer = setTimeout(() => { node.hidden = true; }, 1600);
}

async function copyText(text) {
  try {
    await navigator.clipboard.writeText(text);
    toast('已复制');
  } catch (error) {
    const area = document.createElement('textarea');
    area.value = text;
    area.style.position = 'fixed';
    area.style.opacity = '0';
    document.body.appendChild(area);
    area.select();
    try { document.execCommand('copy'); toast('已复制'); }
    catch (err) { toast('复制失败，请手动选择'); }
    area.remove();
  }
}

function highlightCode(code, lang) {
  if (code.dataset.highlighted) return;
  const source = code.textContent;
  if (!source.trim()) return;
  try {
    const escaped = source.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
    const hashLangs = /^(py|python|sh|bash|shell|yaml|yml|ruby|rb|toml)$/i;
    const slashLangs = /^(js|javascript|ts|typescript|jsx|tsx|java|c|cpp|cs|csharp|go|rust|rs|swift|kotlin|kt|json|css|scss|less)$/i;
    let commentPattern;
    if (hashLangs.test(lang)) commentPattern = '#[^\\n]*';
    else if (slashLangs.test(lang)) commentPattern = '\\/\\/[^\\n]*|\\/\\*[\\s\\S]*?\\*\\/';
    else commentPattern = '\\/\\/[^\\n]*|#[^\\n]*';
    const stringPattern = "\"(?:[^\"\\\\]|\\\\.)*\"|'(?:[^'\\\\]|\\\\.)*'|`(?:[^`\\\\]|\\\\.)*`";
    const re = new RegExp(`(${commentPattern})|(${stringPattern})|(\\b\\d+(?:\\.\\d+)?\\b)|(\\b[A-Za-z_][A-Za-z0-9_]*\\b)`, 'g');
    const keywords = new Set([
      'const', 'let', 'var', 'function', 'return', 'if', 'else', 'for', 'while', 'class', 'new',
      'import', 'from', 'export', 'default', 'async', 'await', 'try', 'catch', 'finally', 'throw',
      'typeof', 'instanceof', 'in', 'of', 'this', 'super', 'extends', 'implements', 'interface',
      'type', 'enum', 'def', 'self', 'None', 'True', 'False', 'and', 'or', 'not', 'is', 'lambda',
      'with', 'as', 'pass', 'break', 'continue', 'yield', 'raise', 'except', 'global', 'nonlocal',
      'print', 'range', 'len', 'int', 'float', 'str', 'list', 'dict', 'set', 'tuple', 'do', 'switch',
      'case', 'void', 'public', 'private', 'protected', 'static', 'final', 'struct', 'impl', 'fn',
      'mut', 'use', 'mod', 'pub', 'match', 'where', 'select', 'insert', 'update', 'delete', 'create'
    ]);
    let out = '';
    let last = 0;
    let match;
    while ((match = re.exec(escaped))) {
      out += escaped.slice(last, match.index);
      if (match[1]) out += `<span class="tok-com">${match[1]}</span>`;
      else if (match[2]) out += `<span class="tok-str">${match[2]}</span>`;
      else if (match[3]) out += `<span class="tok-num">${match[3]}</span>`;
      else if (match[4] && keywords.has(match[4])) out += `<span class="tok-key">${match[4]}</span>`;
      else out += match[4];
      last = re.lastIndex;
    }
    out += escaped.slice(last);
    code.innerHTML = out;
    code.dataset.highlighted = '1';
  } catch (error) {
    console.warn('[InterStudy] 代码高亮失败', error);
  }
}

function setupCodeBlocks(root) {
  $$('pre', root).forEach(pre => {
    if (pre.querySelector('.copy-btn')) return;
    const code = pre.querySelector('code');
    if (!code) return;
    const button = document.createElement('button');
    button.type = 'button';
    button.className = 'copy-btn';
    button.textContent = '复制';
    button.addEventListener('click', event => {
      event.stopPropagation();
      copyText(code.textContent);
    });
    pre.appendChild(button);
    if (code.dataset.lang) highlightCode(code, code.dataset.lang);
  });
}

function validateTopic() {
  const warnings = [];
  const T = IS.T;
  const meta = T.meta || {};
  if (!meta.title) warnings.push('meta.title 缺失');
  if (!meta.slug) warnings.push('meta.slug 缺失，文件名将使用 topic');
  if (!Array.isArray(T.chapters) || !T.chapters.length) warnings.push('至少需要一个章节');
  if (!T.tree || !Array.isArray(T.tree.nodes) || !T.tree.nodes.length) warnings.push('知识树为空');
  if (Array.isArray(T.quiz) && T.quiz.length !== 5) warnings.push(`测验应为 5 题，当前 ${T.quiz.length} 题`);
  if (!Array.isArray(T.quiz) || !T.quiz.length) warnings.push('测验为空');

  const chapterIds = new Set((T.chapters || []).map(c => c.id));
  if (chapterIds.has('quiz') || chapterIds.has('sources')) warnings.push('章节 id 不能使用 quiz 或 sources');

  (T.chapters || []).forEach(ch => {
    (ch.sceneIds || []).forEach(id => {
      if (!IS.maps.scenes.has(id)) warnings.push(`章节 ${ch.id} 引用了不存在的场景 ${id}`);
    });
    (ch.sourceIds || []).forEach(id => {
      if (!IS.maps.sources.has(id)) warnings.push(`章节 ${ch.id} 引用了不存在的来源 ${id}`);
    });
    if (/<script\b/i.test(ch.content || '')) warnings.push(`章节 ${ch.id} 包含 <script>`);
  });

  (T.tree.nodes || []).forEach(node => {
    const target = node.targetId;
    if (!target) return;
    if (node.type === 'chapter' && !chapterIds.has(target) && target !== 'quiz' && target !== 'sources') {
      warnings.push(`树节点 ${node.id} 指向不存在的章节 ${target}`);
    }
    if (node.type === 'concept' && !IS.maps.concepts.has(target)) warnings.push(`树节点 ${node.id} 指向不存在的概念 ${target}`);
    if (node.type === 'algorithm' && !IS.maps.algorithms.has(target)) warnings.push(`树节点 ${node.id} 指向不存在的算法 ${target}`);
    if ((node.type === 'module' || node.type === 'component') && !IS.maps.modules.has(target)) {
      warnings.push(`树节点 ${node.id} 指向不存在的模块 ${target}`);
    }
    if (node.type === 'process' && !IS.maps.algorithms.has(target) && !IS.maps.modules.has(target)) {
      warnings.push(`树节点 ${node.id} 指向不存在的流程对象 ${target}`);
    }
  });

  (T.concepts || []).forEach(c => {
    (c.relatedConceptIds || []).forEach(id => {
      if (!IS.maps.concepts.has(id)) warnings.push(`概念 ${c.id} 关联了不存在的概念 ${id}`);
    });
  });
  (T.algorithms || []).forEach(a => {
    (a.relatedAlgorithmIds || []).forEach(id => {
      if (!IS.maps.algorithms.has(id)) warnings.push(`算法 ${a.id} 关联了不存在的算法 ${id}`);
    });
  });
  (T.quiz || []).forEach((q, i) => {
    if (!Array.isArray(q.options) || q.options.length < 2) warnings.push(`测验第 ${i + 1} 题选项不足`);
    if (typeof q.answer !== 'number' || q.answer < 0 || q.answer >= (q.options || []).length) {
      warnings.push(`测验第 ${i + 1} 题 answer 下标无效`);
    }
  });

  IS.state.warnings = warnings;
  if (warnings.length) {
    console.warn('[InterStudy] 内容校验警告：', warnings);
    if (/[?&](debug|validate)\b/.test(location.search)) {
      const banner = el('div', 'callout');
      banner.innerHTML = `<strong>内容校验警告</strong><ul>${warnings.map(w => `<li>${esc(w)}</li>`).join('')}</ul>`;
      $('#main').prepend(banner);
    }
  }
}

IS.index = function () {
  const T = IS.T;
  T.chapters = T.chapters || [];
  T.concepts = T.concepts || [];
  T.algorithms = T.algorithms || [];
  T.modules = T.modules || [];
  T.scenes = T.scenes || [];
  T.sources = T.sources || [];
  T.crossReferences = T.crossReferences || [];
  T.quiz = T.quiz || [];
  T.tree = T.tree || { rootId: null, nodes: [] };
  T.tree.nodes = T.tree.nodes || [];

  IS.maps.chapters = byId(T.chapters);
  IS.maps.concepts = byId(T.concepts);
  IS.maps.algorithms = byId(T.algorithms);
  IS.maps.modules = byId(T.modules);
  IS.maps.scenes = byId(T.scenes);
  IS.maps.sources = byId(T.sources);
  IS.maps.nodes = byId(T.tree.nodes);
  IS.maps.children = new Map();
  T.tree.nodes.forEach(node => {
    const key = node.parentId || '__root__';
    if (!IS.maps.children.has(key)) IS.maps.children.set(key, []);
    IS.maps.children.get(key).push(node);
  });
  IS.maps.children.forEach(list => list.sort((a, b) => (a.order || 0) - (b.order || 0)));
};

function childrenOf(id) { return IS.maps.children.get(id) || []; }

IS.renderChapters = function () {
  const root = $('#chapters');
  root.innerHTML = '';
  const chapters = (IS.T.chapters || []).slice().sort((a, b) => (a.order || 0) - (b.order || 0));
  if (!chapters.length) {
    root.appendChild(el('p', 'empty', '暂无章节。'));
    return;
  }
  chapters.forEach((chapter, index) => {
    const section = document.createElement('section');
    section.className = 'chapter';
    section.id = `ch-${chapter.id}`;
    section.dataset.chapter = chapter.id;

    const head = el('div', 'chapter-head');
    head.innerHTML = `<div class="chapter-kicker">第 ${index + 1} 章</div><h2>${esc(chapter.title || '')}</h2>${chapter.summary ? `<p class="chapter-summary">${esc(chapter.summary)}</p>` : ''}`;
    section.appendChild(head);

    const content = el('div', 'chapter-content', raw(chapter.content));
    section.appendChild(content);
    IS.renderScenesInChapter(content, chapter);

    const sources = document.createElement('div');
    if (chapter.sourceIds && chapter.sourceIds.length) {
      sources.className = 'chapter-sources';
      sources.innerHTML = `<span class="label">本章来源</span>${sourceChips(chapter.sourceIds)}`;
      section.appendChild(sources);
    }
    root.appendChild(section);
  });
};

IS.renderTree = function () {
  const tree = $('#tree');
  tree.innerHTML = '';
  const rootNode = IS.maps.nodes.get(IS.T.tree.rootId);
  if (!rootNode) {
    tree.appendChild(el('p', 'empty', '知识树为空。'));
    return;
  }
  if (!IS.state.treeInitialized) {
    IS.state.expanded.add(rootNode.id);
    childrenOf(rootNode.id).forEach(node => IS.state.expanded.add(node.id));
    IS.state.treeInitialized = true;
  }
  tree.appendChild(buildTreeNode(rootNode));
  IS.updateTreeActive(IS.state.currentChapterId);
};

function buildTreeNode(node) {
  const li = document.createElement('li');
  li.className = `tree-node type-${node.type}`;
  li.dataset.nodeId = node.id;
  IS.dom.treeNodes.set(node.id, li);

  const row = document.createElement('div');
  row.className = 'tree-row';
  row.dataset.nodeId = node.id;
  row.setAttribute('role', 'treeitem');
  IS.dom.treeRows.set(node.id, row);

  const children = childrenOf(node.id);
  if (children.length) {
    const toggle = document.createElement('button');
    toggle.type = 'button';
    toggle.className = 'tree-toggle';
    toggle.textContent = '▸';
    toggle.setAttribute('aria-label', `展开或收起 ${node.title || ''}`);
    toggle.setAttribute('aria-expanded', String(IS.state.expanded.has(node.id)));
    if (IS.state.expanded.has(node.id)) toggle.classList.add('open');
    toggle.addEventListener('click', event => {
      event.stopPropagation();
      toggleTreeNode(node.id);
    });
    row.appendChild(toggle);
    IS.dom.treeToggles.set(node.id, toggle);
  } else {
    row.appendChild(el('span', 'tree-spacer'));
  }

  const badge = el('span', 'tree-badge', esc(badgeFor(node.type)));
  badge.title = typeLabel(node.type);
  row.appendChild(badge);
  row.appendChild(el('span', 'tree-title', esc(node.title || '')));

  row.addEventListener('click', () => activateTreeNode(node));
  li.appendChild(row);

  if (children.length) {
    const ul = document.createElement('ul');
    ul.className = 'tree-children';
    ul.hidden = !IS.state.expanded.has(node.id);
    children.forEach(child => ul.appendChild(buildTreeNode(child)));
    li.appendChild(ul);
    IS.dom.treeChildUls.set(node.id, ul);
  }
  return li;
}

function applyExpanded(id, open) {
  const ul = IS.dom.treeChildUls.get(id);
  const toggle = IS.dom.treeToggles.get(id);
  if (ul) ul.hidden = !open;
  if (toggle) {
    toggle.classList.toggle('open', open);
    toggle.setAttribute('aria-expanded', String(open));
  }
  if (open) IS.state.expanded.add(id);
  else IS.state.expanded.delete(id);
}

function toggleTreeNode(id) {
  const open = !IS.state.expanded.has(id);
  applyExpanded(id, open);
}

function expandAncestors(id) {
  let node = IS.maps.nodes.get(id);
  while (node && node.parentId) {
    applyExpanded(node.parentId, true);
    node = IS.maps.nodes.get(node.parentId);
  }
}

function activateTreeNode(node) {
  if (node.type === 'topic') {
    window.scrollTo({ top: 0, behavior: 'smooth' });
  } else if (node.type === 'concept') {
    IS.openConcept(node.targetId);
  } else if (node.type === 'algorithm') {
    IS.openDetail('algorithm', node.targetId);
  } else if (node.type === 'module' || node.type === 'component') {
    IS.openDetail('module', node.targetId);
  } else if (node.type === 'process') {
    IS.openDetail(IS.maps.algorithms.has(node.targetId) ? 'algorithm' : 'module', node.targetId);
  } else {
    IS.scrollToTarget(node.targetId);
  }
  IS.closeNav();
}

IS.scrollToTarget = function (id) {
  if (!id) return;
  const direct = document.getElementById(id);
  const chapter = document.getElementById(`ch-${id}`);
  if (chapter) {
    chapter.scrollIntoView({ behavior: 'smooth', block: 'start' });
    IS.setActiveChapter(id);
    return;
  }
  if (direct) {
    direct.scrollIntoView({ behavior: 'smooth', block: 'start' });
    const parent = direct.closest('[data-chapter]');
    if (parent) IS.setActiveChapter(parent.dataset.chapter);
  }
};

IS.setActiveChapter = function (id) {
  if (!id) return;
  if (IS.state.currentChapterId === id && IS.state.activeTreeNodeId) return;
  const same = IS.state.currentChapterId === id;
  IS.state.currentChapterId = id;
  $('#chapterIndicator').textContent = chapterLabel(id);

  IS.dom.treeRows.forEach(row => {
    row.classList.remove('active');
    row.removeAttribute('aria-current');
  });

  const matches = (IS.T.tree.nodes || []).filter(node =>
    node.targetId === id && (node.type === 'chapter' || node.type === 'section')
  );
  matches.forEach(node => {
    const row = IS.dom.treeRows.get(node.id);
    if (row) {
      row.classList.add('active');
      row.setAttribute('aria-current', 'page');
      IS.state.activeTreeNodeId = node.id;
    }
    expandAncestors(node.id);
  });

  if (!same && matches.length) {
    const first = IS.dom.treeRows.get(matches[0].id);
    const tree = $('#tree');
    if (first && tree) {
      const rowRect = first.getBoundingClientRect();
      const treeRect = tree.getBoundingClientRect();
      if (rowRect.top < treeRect.top || rowRect.bottom > treeRect.bottom) {
        tree.scrollTop += rowRect.top - treeRect.top - tree.clientHeight / 2;
      }
    }
  }
};

IS.updateTreeActive = function (id) { if (id) IS.setActiveChapter(id); };

function setupTreeSearch() {
  const input = $('#treeSearch');
  if (!input) return;
  let timer = null;
  input.addEventListener('input', () => {
    clearTimeout(timer);
    timer = setTimeout(() => applyTreeSearch(input.value.trim()), 120);
  });
}

function applyTreeSearch(query) {
  const nodes = IS.T.tree.nodes || [];
  if (!query) {
    if (IS.state.preSearchExpanded) {
      IS.state.expanded = new Set(IS.state.preSearchExpanded);
      IS.state.preSearchExpanded = null;
    }
    nodes.forEach(node => {
      const li = IS.dom.treeNodes.get(node.id);
      const row = IS.dom.treeRows.get(node.id);
      if (li) li.hidden = false;
      if (row) row.classList.remove('match');
      applyExpanded(node.id, IS.state.expanded.has(node.id));
    });
    return;
  }
  if (!IS.state.preSearchExpanded) {
    IS.state.preSearchExpanded = new Set(IS.state.expanded);
  }
  const needle = query.toLowerCase();
  const matches = new Set();
  nodes.forEach(node => {
    const text = `${node.title || ''} ${node.description || ''}`.toLowerCase();
    if (text.includes(needle)) matches.add(node.id);
  });
  const visible = new Set(matches);
  matches.forEach(id => {
    let node = IS.maps.nodes.get(id);
    while (node && node.parentId) {
      visible.add(node.parentId);
      node = IS.maps.nodes.get(node.parentId);
    }
  });
  nodes.forEach(node => {
    const li = IS.dom.treeNodes.get(node.id);
    const row = IS.dom.treeRows.get(node.id);
    if (li) li.hidden = !visible.has(node.id);
    if (row) row.classList.toggle('match', matches.has(node.id));
  });
  visible.forEach(id => applyExpanded(id, true));
}

IS.closeNav = function () {};

function setupMobileNav() {
  const body = document.body;
  const button = $('#navToggle');
  const backdrop = $('#sidebarBackdrop');
  if (!button || !backdrop) return;
  const open = () => {
    body.classList.add('nav-open');
    button.setAttribute('aria-expanded', 'true');
    backdrop.hidden = false;
  };
  const close = () => {
    body.classList.remove('nav-open');
    button.setAttribute('aria-expanded', 'false');
    backdrop.hidden = true;
  };
  IS.closeNav = close;
  button.addEventListener('click', () => body.classList.contains('nav-open') ? close() : open());
  backdrop.addEventListener('click', close);
  window.addEventListener('resize', () => { if (window.innerWidth > 900) close(); });
}

function setupTheme() {
  const root = document.documentElement;
  const button = $('#themeToggle');
  const setTheme = theme => {
    root.dataset.theme = theme;
    IS.state.theme = theme;
    if (button) {
      button.textContent = theme === 'dark' ? '☀' : '◐';
      button.setAttribute('aria-label', theme === 'dark' ? '切换浅色模式' : '切换深色模式');
    }
    try { localStorage.setItem('interstudy-theme', theme); } catch (error) { /* 离线文件可能禁用存储 */ }
  };
  let saved = null;
  try { saved = localStorage.getItem('interstudy-theme'); } catch (error) { /* ignore */ }
  setTheme(saved === 'dark' ? 'dark' : 'light');
  if (button) {
    button.addEventListener('click', () => setTheme(IS.state.theme === 'dark' ? 'light' : 'dark'));
  }
}

function setupScrollSpy() {
  const sections = $$('.chapter');
  if (!sections.length) return;
  let ticking = false;
  const update = () => {
    ticking = false;
    const max = document.documentElement.scrollHeight - window.innerHeight;
    const progress = max > 0 ? Math.min(1, Math.max(0, window.scrollY / max)) : 0;
    const bar = $('#progressBar');
    if (bar) bar.style.width = `${progress * 100}%`;

    const line = window.scrollY + 150;
    let current = sections[0];
    sections.forEach(section => {
      if (section.getBoundingClientRect().top + window.scrollY <= line) current = section;
    });
    if (current && current.dataset.chapter) IS.setActiveChapter(current.dataset.chapter);
  };
  const onScroll = () => {
    if (ticking) return;
    ticking = true;
    requestAnimationFrame(update);
  };
  window.addEventListener('scroll', onScroll, { passive: true });
  window.addEventListener('resize', onScroll);
  update();
}

function setupGlobalClicks() {
  document.addEventListener('click', event => {
    const concept = event.target.closest('[data-concept]');
    if (concept) {
      event.preventDefault();
      IS.openConcept(concept.dataset.concept);
      IS.closeNav();
      return;
    }
    const algorithm = event.target.closest('[data-algorithm]');
    if (algorithm) {
      event.preventDefault();
      IS.openDetail('algorithm', algorithm.dataset.algorithm);
      IS.closeNav();
      return;
    }
    const module = event.target.closest('[data-module]');
    if (module) {
      event.preventDefault();
      IS.openDetail('module', module.dataset.module);
      IS.closeNav();
      return;
    }
    const close = event.target.closest('[data-close="concept"]');
    if (close) {
      event.preventDefault();
      IS.closeConcept();
      return;
    }
    const sourceLink = event.target.closest('a[href^="#src-"]');
    if (sourceLink) {
      IS.closeAllOverlays();
      return;
    }
    const pageLink = event.target.closest('a[href^="#ch-"], a[href="#quiz"], a[href="#sources"]');
    if (pageLink && (!document.getElementById('detail').hidden || !document.getElementById('conceptModal').hidden)) {
      IS.closeAllOverlays();
    }
  });

  const detail = $('#detail');
  if (detail) {
    detail.addEventListener('click', event => {
      if (event.target === detail) IS.closeDetail();
    });
  }
  const back = $('#detailBack');
  const close = $('#detailClose');
  if (back) back.addEventListener('click', () => IS.closeDetail());
  if (close) close.addEventListener('click', () => IS.closeDetail());

  document.addEventListener('keydown', event => {
    if (event.key !== 'Escape') return;
    if (!document.getElementById('conceptModal').hidden) IS.closeConcept();
    else if (!document.getElementById('detail').hidden) IS.closeDetail();
  });
}

IS.init = function () {
  IS.index();
  validateTopic();
  IS.renderHero();
  IS.renderChapters();
  IS.renderTree();
  IS.renderQuiz();
  IS.renderSourcesSection();
  setupTheme();
  setupTreeSearch();
  setupMobileNav();
  setupGlobalClicks();
  setupScrollSpy();
  setupCodeBlocks(document);

  const hash = decodeURIComponent(location.hash.slice(1));
  let initial = (IS.T.chapters[0] || {}).id || null;
  if (hash.startsWith('ch-')) initial = hash.slice(3);
  else if (hash === 'quiz' || hash === 'sources') initial = hash;
  if (initial) IS.setActiveChapter(initial);
  if (hash && document.getElementById(hash)) {
    setTimeout(() => document.getElementById(hash).scrollIntoView({ block: 'start' }), 0);
  }
};

/* 概念弹窗、算法/模块深入视图、来源列表 */
IS.state.lockCount = IS.state.lockCount || 0;

function lockBody() {
  IS.state.lockCount += 1;
  document.body.classList.add('locked');
}

function unlockBody() {
  IS.state.lockCount = Math.max(0, IS.state.lockCount - 1);
  if (!IS.state.lockCount) document.body.classList.remove('locked');
}

function detailSection(title, content) {
  if (!content) return '';
  return `<div class="detail-section"><h3>${esc(title)}</h3>${content}</div>`;
}

function listHtml(items) {
  if (!items || !items.length) return '';
  return `<ul>${items.map(item => `<li>${raw(item)}</li>`).join('')}</ul>`;
}

function pillRow(items) {
  if (!items || !items.length) return '';
  return `<div class="pill-row">${items.map(item => `<span class="pill">${esc(item)}</span>`).join('')}</div>`;
}

function relatedHtml(obj, type) {
  const ids = new Set();
  if (type === 'concept') (obj.relatedConceptIds || []).forEach(id => ids.add(id));
  if (type === 'algorithm') (obj.relatedAlgorithmIds || []).forEach(id => ids.add(id));
  const refs = (IS.T.crossReferences || []).filter(ref => ref.sourceId === obj.id || ref.targetId === obj.id);
  refs.forEach(ref => ids.add(ref.sourceId === obj.id ? ref.targetId : ref.sourceId));
  ids.delete(obj.id);

  const pills = Array.from(ids).map(id => `<span class="pill">${refButton(id)}</span>`).join('');
  const relations = refs.map(ref => {
    const other = ref.sourceId === obj.id ? ref.targetId : ref.sourceId;
    return `<li><span class="pill">${esc(xrefLabel(ref.type))}</span> ${refButton(other)}${ref.description ? `<span class="empty"> ${raw(ref.description)}</span>` : ''}</li>`;
  }).join('');

  if (!pills && !relations) return '';
  return `${pills ? `<div class="pill-row">${pills}</div>` : ''}${relations ? `<ul class="relation-list">${relations}</ul>` : ''}`;
}

function buildConceptBody(concept) {
  const parts = [];
  parts.push(detailSection('定义', concept.definition ? `<p>${raw(concept.definition)}</p>` : ''));
  parts.push(detailSection('通俗解释', concept.explanation ? `<p>${raw(concept.explanation)}</p>` : ''));
  parts.push(detailSection('技术原理', listHtml(concept.principles)));
  parts.push(detailSection('示例', listHtml(concept.examples)));
  parts.push(detailSection('相关与关联', relatedHtml(concept, 'concept')));
  if (concept.sourceIds && concept.sourceIds.length) {
    parts.push(detailSection('来源', `<div class="chip-row">${sourceChips(concept.sourceIds)}</div>`));
  }
  return parts.filter(Boolean).join('') || '<p class="empty">暂无详细内容。</p>';
}

function buildAlgorithmDetail(algorithm) {
  const parts = [];
  parts.push(detailSection('它解决的问题', algorithm.problem ? `<p>${raw(algorithm.problem)}</p>` : ''));
  parts.push(detailSection('背景', algorithm.background ? `<p>${raw(algorithm.background)}</p>` : ''));
  parts.push(detailSection('前置概念', pillRow(algorithm.prerequisites)));
  parts.push(detailSection('核心思想', algorithm.principle ? `<p>${raw(algorithm.principle)}</p>` : ''));
  if (algorithm.formulas && algorithm.formulas.length) {
    parts.push(detailSection('公式', algorithm.formulas.map(formula => `<div class="formula">${raw(formula)}</div>`).join('')));
  }
  if (algorithm.pseudocode) {
    parts.push(detailSection('伪代码', `<pre><code>${esc(algorithm.pseudocode)}</code></pre>`));
  }
  if (algorithm.steps && algorithm.steps.length) {
    parts.push(detailSection('执行步骤', `<ol>${algorithm.steps.map(step => `<li><strong>${esc(step.title || '')}</strong>${step.text ? `：${raw(step.text)}` : ''}</li>`).join('')}</ol>`));
  }
  if (algorithm.complexity) {
    const complexity = [];
    if (algorithm.complexity.time) complexity.push(`时间：${algorithm.complexity.time}`);
    if (algorithm.complexity.space) complexity.push(`空间：${algorithm.complexity.space}`);
    parts.push(detailSection('复杂度', pillRow(complexity)));
  }
  parts.push(detailSection('优势', listHtml(algorithm.advantages)));
  parts.push(detailSection('局限', listHtml(algorithm.limitations)));
  parts.push(detailSection('适用场景', listHtml(algorithm.applications)));
  parts.push(detailSection('相关与关联', relatedHtml(algorithm, 'algorithm')));
  if (algorithm.sourceIds && algorithm.sourceIds.length) {
    parts.push(detailSection('来源', `<div class="chip-row">${sourceChips(algorithm.sourceIds)}</div>`));
  }
  return parts.filter(Boolean).join('') || '<p class="empty">暂无详细内容。</p>';
}

function buildModuleDetail(module) {
  const parts = [];
  parts.push(detailSection('模块职责', module.responsibility ? `<p>${raw(module.responsibility)}</p>` : ''));
  parts.push(detailSection('输入', listHtml(module.inputs)));
  parts.push(detailSection('输出', listHtml(module.outputs)));
  parts.push(detailSection('内部组件', pillRow(module.components)));
  parts.push(detailSection('依赖', pillRow(module.dependencies)));
  if (module.executionFlow && module.executionFlow.length) {
    parts.push(detailSection('执行流程', `<ol>${module.executionFlow.map(step => `<li>${raw(step)}</li>`).join('')}</ol>`));
  }
  if (module.implementation) {
    parts.push(detailSection('关键实现', `<pre><code>${esc(module.implementation)}</code></pre>`));
  }
  parts.push(detailSection('相关与关联', relatedHtml(module, 'module')));
  if (module.sourceIds && module.sourceIds.length) {
    parts.push(detailSection('来源', `<div class="chip-row">${sourceChips(module.sourceIds)}</div>`));
  }
  return parts.filter(Boolean).join('') || '<p class="empty">暂无详细内容。</p>';
}

IS.openConcept = function (id) {
  const concept = IS.maps.concepts.get(id);
  if (!concept) {
    console.warn('[InterStudy] 未找到概念', id);
    return;
  }
  const modal = $('#conceptModal');
  if (modal.hidden) {
    IS.state.lastFocus = document.activeElement;
    lockBody();
  }
  $('#conceptTitle').textContent = concept.name || id;
  const body = $('#conceptBody');
  body.innerHTML = buildConceptBody(concept);
  setupCodeBlocks(body);
  modal.hidden = false;
  const panel = modal.querySelector('.modal-panel');
  if (panel) panel.scrollTop = 0;
  const close = modal.querySelector('[data-close="concept"]');
  if (close) close.focus();
};

IS.closeConcept = function (restoreFocus = true) {
  const modal = $('#conceptModal');
  if (!modal || modal.hidden) return;
  modal.hidden = true;
  unlockBody();
  if (restoreFocus && IS.state.lastFocus && document.contains(IS.state.lastFocus)) {
    IS.state.lastFocus.focus({ preventScroll: true });
  }
  if (!document.getElementById('detail') || document.getElementById('detail').hidden) {
    IS.state.lastFocus = null;
  }
};

IS.openDetail = function (type, id) {
  let kind = type;
  let object = kind === 'algorithm' ? IS.maps.algorithms.get(id) : IS.maps.modules.get(id);
  if (!object && kind === 'algorithm' && IS.maps.modules.has(id)) {
    kind = 'module';
    object = IS.maps.modules.get(id);
  }
  if (!object && kind === 'module' && IS.maps.algorithms.has(id)) {
    kind = 'algorithm';
    object = IS.maps.algorithms.get(id);
  }
  if (!object) {
    console.warn('[InterStudy] 未找到深入条目', type, id);
    return;
  }

  const detail = $('#detail');
  const concept = $('#conceptModal');
  const conceptOpen = !concept.hidden;

  if (detail.hidden) {
    IS.state.lastFocus = conceptOpen ? IS.state.lastFocus : document.activeElement;
    lockBody();
  }
  if (conceptOpen) IS.closeConcept(false);

  detail.dataset.type = kind;
  detail.dataset.id = id;
  $('#detailKicker').textContent = kind === 'algorithm' ? '算法深入' : '模块深入';
  $('#detailTitle').textContent = object.name || id;
  const body = $('#detailBody');
  body.innerHTML = kind === 'algorithm' ? buildAlgorithmDetail(object) : buildModuleDetail(object);
  setupCodeBlocks(body);
  detail.hidden = false;
  const panel = detail.querySelector('.detail-panel');
  if (panel) panel.scrollTop = 0;
  const close = $('#detailClose');
  if (close) close.focus();
};

IS.closeDetail = function (restoreFocus = true) {
  const detail = $('#detail');
  if (!detail || detail.hidden) return;
  detail.hidden = true;
  detail.dataset.type = '';
  detail.dataset.id = '';
  unlockBody();
  if (restoreFocus && IS.state.lastFocus && document.contains(IS.state.lastFocus)) {
    IS.state.lastFocus.focus({ preventScroll: true });
  }
  IS.state.lastFocus = null;
};

IS.closeAllOverlays = function () {
  if (!document.getElementById('conceptModal').hidden) IS.closeConcept(false);
  if (!document.getElementById('detail').hidden) IS.closeDetail(false);
};

IS.renderSourcesSection = function () {
  const section = $('#sources');
  const root = $('#sourcesRoot');
  const sources = IS.T.sources || [];
  if (!sources.length) {
    if (section) section.remove();
    return;
  }
  root.innerHTML = sources.map(source => {
    const title = source.url
      ? `<a href="${esc(source.url)}" target="_blank" rel="noopener noreferrer">${esc(source.title || source.id)}</a>`
      : esc(source.title || source.id);
    const meta = [
      sourceTypeLabel(source.type),
      source.author,
      source.publisher,
      source.publishedAt ? `发表 ${source.publishedAt}` : '',
      source.accessedAt ? `访问 ${source.accessedAt}` : ''
    ].filter(Boolean).join(' · ');
    const evidence = source.evidenceDescription
      ? `<div class="source-evidence">${raw(source.evidenceDescription)}</div>`
      : '';
    return `<li class="source-item" id="src-${esc(source.id)}"><div class="source-title">${title}</div><div class="source-meta">${esc(meta)}</div>${evidence}</li>`;
  }).join('');
};
